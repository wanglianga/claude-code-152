services:
  db:
    image: postgres:15-alpine
    container_name: furniture-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: furniture
    ports:
      - "5432:5432"
    volumes:
      - furniture-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d furniture"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: furniture-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "3000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: furniture
      JWT_SECRET: compose-dev-secret
      SEED_ON_BOOT: "true"
    ports:
      - "3000:3000"

  frontend:
    build: ./frontend
    container_name: furniture-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  furniture-pgdata:
